name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy src

      - name: Validate Course Bundle and Activities
        run: python scripts/validate_course.py

      - name: Test
        run: python -m pytest --cov=romeo --cov-report=term-missing --cov-fail-under=80

  runtime-runner-smoke:
    name: Runtime runner Docker smoke
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build digest-pinned runtime runner
        run: >-
          docker build
          --build-arg PYTHON_BASE_IMAGE=python:3.12.11-slim-bookworm@sha256:519591d6871b7bc437060736b9f7456b8731f1499a57e22e6c285135ae657bf7
          --tag romeo-runtime-runner:ci
          --file docker/runtime-runner/Dockerfile
          .

      - name: Exercise production ENTRYPOINT and broker envelope
        run: python scripts/smoke_runtime_runner.py --image romeo-runtime-runner:ci
