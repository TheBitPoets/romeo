name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHON_BASE_IMAGE: python:3.12.11-slim-bookworm@sha256:519591d6871b7bc437060736b9f7456b8731f1499a57e22e6c285135ae657bf7

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy src

      - name: Validate Course Bundle and Activities
        run: python scripts/validate_course.py

      - name: Test
        run: python -m pytest --cov=romeo --cov-report=term-missing --cov-fail-under=80

  docs:
    name: Sphinx documentation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install documentation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[web,docs]"

      - name: Generate public Course Bundle catalog
        run: python scripts/generate_course_docs.py

      - name: Build documentation with warnings as errors
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html

  runtime-runner-smoke:
    name: Runtime runner Docker smoke
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python for wheelhouse
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.11"
          cache: pip

      - name: Prepare hash-verified wheelhouse
        shell: bash
        run: |
          set -euo pipefail
          rm -rf docker/runtime-runner/wheelhouse
          mkdir -p docker/runtime-runner/wheelhouse
          python -m pip install --upgrade pip
          python -m pip download \
            --require-hashes \
            --only-binary=:all: \
            --dest docker/runtime-runner/wheelhouse \
            -r docker/runtime-runner/requirements.lock

      - name: Build digest-pinned runtime runner
        run: >-
          docker build
          --build-arg PYTHON_BASE_IMAGE="${PYTHON_BASE_IMAGE}"
          --tag romeo-runtime-runner:ci
          --file docker/runtime-runner/Dockerfile
          .

      - name: Exercise production ENTRYPOINT and broker envelope
        run: python scripts/smoke_runtime_runner.py --image romeo-runtime-runner:ci
