name: Publish documentation

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/docs-pages.yml"
      - "docs/**"
      - "course/**"
      - "scripts/generate_course_docs.py"
      - "src/**"
      - "pyproject.toml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Sphinx site
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install documentation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[web,docs]"

      - name: Generate public Course Bundle catalog
        run: python scripts/generate_course_docs.py

      - name: Build documentation with warnings as errors
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    name: Deploy GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Check out main for deployment record
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Persist successful Pages deployment
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          if [[ -z "${PAGE_URL}" ]]; then
            echo "deploy-pages did not return a page URL" >&2
            exit 1
          fi

          {
            echo "# Generated only after a successful GitHub Pages deployment; do not edit manually."
            echo "ROMEO_DOCS_URL=${PAGE_URL}"
            echo "ROMEO_DOCS_SOURCE_SHA=${GITHUB_SHA}"
            echo "ROMEO_DOCS_WORKFLOW_RUN=${GITHUB_RUN_ID}"
          } > .github/docs-site-current.env

          git add -- .github/docs-site-current.env
          if git diff --cached --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(docs): record Pages deployment [skip ci]"
          git push origin HEAD:main
