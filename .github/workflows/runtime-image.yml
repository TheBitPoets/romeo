name: Publish runtime runner

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/runtime-image.yml"
      - "docker/runtime-runner/**"
      - "src/**"
      - "pyproject.toml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/thebitpoets/romeo-runtime
  PYTHON_BASE_IMAGE: python:3.12.11-slim-bookworm@sha256:519591d6871b7bc437060736b9f7456b8731f1499a57e22e6c285135ae657bf7

jobs:
  publish:
    name: Build, publish and verify runtime image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.11"
          cache: pip

      - name: Prepare hash-verified wheelhouse
        shell: bash
        run: |
          set -euo pipefail
          rm -rf docker/runtime-runner/wheelhouse
          mkdir -p docker/runtime-runner/wheelhouse
          python -m pip install --upgrade pip
          python -m pip download \
            --require-hashes \
            --only-binary=:all: \
            --dest docker/runtime-runner/wheelhouse \
            -r docker/runtime-runner/requirements.lock

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and publish immutable runtime image
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --build-arg PYTHON_BASE_IMAGE="${PYTHON_BASE_IMAGE}" \
            --file docker/runtime-runner/Dockerfile \
            --tag "${IMAGE}:${GITHUB_SHA}" \
            --provenance=mode=max \
            --sbom=true \
            --metadata-file runtime-image-metadata.json \
            --push \
            .

          DIGEST="$(python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("runtime-image-metadata.json").read_text(encoding="utf-8"))
          digest = payload.get("containerimage.digest")
          if not isinstance(digest, str) or not digest.startswith("sha256:"):
              raise SystemExit("Buildx metadata does not contain containerimage.digest")
          print(digest)
          PY
          )"
          IMAGE_REF="${IMAGE}@${DIGEST}"
          printf 'ROMEO_SANDBOX_IMAGE=%s\n' "${IMAGE_REF}" | tee runtime-image.env
          printf 'digest=%s\n' "${DIGEST}" >> "${GITHUB_OUTPUT}"
          printf 'image_ref=%s\n' "${IMAGE_REF}" >> "${GITHUB_OUTPUT}"

      - name: Smoke-test the published digest
        run: python scripts/smoke_runtime_runner.py --image "${{ steps.publish.outputs.image_ref }}"

      - name: Record immutable deployment reference
        shell: bash
        run: |
          {
            echo "## Romeo runtime image"
            echo
            echo '```text'
            cat runtime-image.env
            echo '```'
            echo
            echo "OCI provenance and SBOM attestations were published by Buildx with the image."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload deployment metadata
        uses: actions/upload-artifact@v4
        with:
          name: romeo-runtime-image-${{ github.sha }}
          path: |
            runtime-image.env
            runtime-image-metadata.json
          if-no-files-found: error
