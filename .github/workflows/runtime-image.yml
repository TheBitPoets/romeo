name: Publish runtime runner

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/runtime-image.yml"
      - "docker/runtime-runner/**"
      - "src/**"
      - "pyproject.toml"
      - "README.md"
      - "scripts/smoke_runtime_runner.py"
      - "scripts/smoke_thebitlab_published_runtime.py"
      - "course/activities/y1-u08-avanti-indietro/**"
      - "course/activities/y2-u07-json/**"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/thebitpoets/romeo-runtime
  PYTHON_BASE_IMAGE: python:3.12.11-slim-bookworm@sha256:519591d6871b7bc437060736b9f7456b8731f1499a57e22e6c285135ae657bf7
  THEBITLAB_BROKER_SHA: dcb76f600fa951ba94fffbd355a6c13dfcbfb424

jobs:
  publish:
    name: Build, publish and verify runtime image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.11"
          cache: pip

      - name: Prepare hash-verified wheelhouse
        shell: bash
        run: |
          set -euo pipefail
          rm -rf docker/runtime-runner/wheelhouse
          mkdir -p docker/runtime-runner/wheelhouse
          python -m pip install --upgrade pip
          python -m pip download \
            --require-hashes \
            --only-binary=:all: \
            --dest docker/runtime-runner/wheelhouse \
            -r docker/runtime-runner/requirements.lock

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and publish immutable runtime image
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --build-arg PYTHON_BASE_IMAGE="${PYTHON_BASE_IMAGE}" \
            --file docker/runtime-runner/Dockerfile \
            --tag "${IMAGE}:${GITHUB_SHA}" \
            --provenance=mode=max \
            --sbom=true \
            --metadata-file runtime-image-metadata.json \
            --push \
            .

          DIGEST="$(python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("runtime-image-metadata.json").read_text(encoding="utf-8"))
          digest = payload.get("containerimage.digest")
          if not isinstance(digest, str) or not digest.startswith("sha256:"):
              raise SystemExit("Buildx metadata does not contain containerimage.digest")
          print(digest)
          PY
          )"
          IMAGE_REF="${IMAGE}@${DIGEST}"
          printf 'ROMEO_SANDBOX_IMAGE=%s\n' "${IMAGE_REF}" | tee runtime-image.env
          printf 'digest=%s\n' "${DIGEST}" >> "${GITHUB_OUTPUT}"
          printf 'image_ref=%s\n' "${IMAGE_REF}" >> "${GITHUB_OUTPUT}"

      - name: Smoke-test the published digest
        run: python scripts/smoke_runtime_runner.py --image "${{ steps.publish.outputs.image_ref }}"

      - name: Check out trusted TheBitLab broker
        uses: actions/checkout@v4
        with:
          repository: TheBitPoets/2cornot2c
          ref: ${{ env.THEBITLAB_BROKER_SHA }}
          path: .thebitlab
          persist-credentials: false

      - name: Install Romeo plugin for trusted host
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            --no-index \
            --find-links=docker/runtime-runner/wheelhouse \
            --require-hashes \
            -r docker/runtime-runner/requirements.lock
          python -m pip install --no-deps --no-build-isolation .

      - name: Smoke-test through TheBitLab broker
        run: >-
          python scripts/smoke_thebitlab_published_runtime.py
          --thebitlab-root .thebitlab
          --image "${{ steps.publish.outputs.image_ref }}"

      - name: Record immutable deployment reference
        shell: bash
        run: |
          {
            echo "## Romeo runtime image"
            echo
            echo '```text'
            cat runtime-image.env
            echo '```'
            echo
            echo "The published digest passed direct ENTRYPOINT smoke and TheBitLab broker smoke."
            echo "TheBitLab broker commit: ${THEBITLAB_BROKER_SHA}"
            echo "OCI provenance and SBOM attestations were published by Buildx with the image."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload deployment metadata
        uses: actions/upload-artifact@v4
        with:
          name: romeo-runtime-image-${{ github.sha }}
          path: |
            runtime-image.env
            runtime-image-metadata.json
          if-no-files-found: error

      - name: Persist approved digest on main
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          IMAGE_REF: ${{ steps.publish.outputs.image_ref }}
        run: |
          set -euo pipefail
          {
            echo "# Generated after GHCR publish + direct and TheBitLab broker smoke; do not edit manually."
            echo "ROMEO_SANDBOX_IMAGE=${IMAGE_REF}"
            echo "ROMEO_RUNTIME_SOURCE_SHA=${GITHUB_SHA}"
            echo "ROMEO_RUNTIME_WORKFLOW_RUN=${GITHUB_RUN_ID}"
            echo "ROMEO_THEBITLAB_BROKER_SHA=${THEBITLAB_BROKER_SHA}"
          } > docs/release/runtime-image-current.env

          git add -- docs/release/runtime-image-current.env
          if git diff --cached --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(runtime): record published image digest [skip ci]"
          git push origin HEAD:main
