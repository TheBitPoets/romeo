[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thebitlab-romeo"
version = "0.1.0"
description = "API, simulator and teaching runtime for the Romeo robot"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "TheBitLab" }]
dependencies = []

[project.optional-dependencies]
hardware = ["adafruit-circuitpython-crickit>=2.3"]
dev = [
  "mypy>=1.11",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["romeo"]
