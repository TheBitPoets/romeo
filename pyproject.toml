[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "thebitlab-romeo"
version = "0.1.0"
description = "API, simulator and teaching runtime for the Romeo robot"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "TheBitLab" }]
dependencies = []

[project.scripts]
romeo-gamepad = "romeo.gamepad:main"
romeo-keyboard = "romeo.network.keyboard:main"
romeo-tcp-server = "romeo.network.server:main"

[project.entry-points."thebitlab.runtimes"]
romeo-sim = "romeo.integrations.thebitlab:create_plugin"

[project.optional-dependencies]
gamepad = ["pygame>=2.6"]
hardware = ["adafruit-circuitpython-crickit>=2.3"]
web = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
]
course = [
  "fastapi>=0.115",
  "httpx>=0.27",
]
dev = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "mypy>=1.11",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "uvicorn>=0.30",
]

[tool.hatch.build.targets.wheel]
packages = ["src/romeo"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
pythonpath = ["src"]
markers = ["hardware: requires a physical Raspberry Pi peripheral"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["course/activities", ".worktrees"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["romeo"]
